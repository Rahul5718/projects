<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Management - RecipeHub</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">RecipeHub</a>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/profile" class="active">Profile</a>
      <a href="/add-recipe" class="btn-primary-sm">+ Add Recipe</a>
    </div>
  </nav>

  <div class="container">
    <!-- User Profile Header Card -->
    <div class="profile-card">
      <div class="avatar-wrapper" id="profileAvatar">U</div>
      <div class="profile-meta">
        <h2 id="displayName">Loading...</h2>
        <p id="displayBio">Home cook & culinary enthusiast.</p>
        <div class="stats-badges">
          <span class="badge" id="contributedBadge">0 Contributed</span>
          <span class="badge" id="favoritesBadge">0 Favorited</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="openTab(event, 'personal-info')">
        <i class="ri-user-line"></i> Personal Information
      </button>
      <button class="tab-btn" onclick="openTab(event, 'my-recipes')">
        <i class="ri-book-open-line"></i> My Recipes
      </button>
      <button class="tab-btn" onclick="openTab(event, 'favorites')">
        <i class="ri-heart-line"></i> Favorite Recipes
      </button>
    </div>

    <!-- TAB 1: Personal Info & Edit Form -->
    <div id="personal-info" class="tab-content active">
      <div class="panel-card">
        <h3 style="margin-bottom: 6px;">Edit Profile Information</h3>
        <p style="color: #6b7280; font-size: 0.85rem; margin-bottom: 20px;">Keep your contact details and bio up to date.</p>

        <form id="profileForm">
          <div class="input-grid">
            <div class="input-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" placeholder="Full Name" required>
            </div>
            <div class="input-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="Email" required>
            </div>
          </div>
          
          <div class="input-grid">
            <div class="input-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="Phone Number" required>
            </div>
            <div class="input-group">
              <label for="location">Location</label>
              <input type="text" id="location" placeholder="City, Country">
            </div>
          </div>

          <div class="input-group">
            <label for="bio">Short Bio</label>
            <textarea id="bio" rows="3" placeholder="Tell the community about your cooking style..."></textarea>
          </div>

          <button type="submit" class="btn-primary">Save Changes</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: Contributed Recipes -->
    <div id="my-recipes" class="tab-content">
      <div class="recipes-grid" id="contributedGrid">
        <!-- Injected via profile.js -->
      </div>
    </div>

    <!-- TAB 3: Favorite Recipes -->
    <div id="favorites" class="tab-content">
      <div class="recipes-grid" id="favoritesGrid">
        <!-- Injected via profile.js -->
      </div>
    </div>
  </div>

  <script src="/api.js"></script>
  <script src="/profile.js"></script>
</body>
</html>
