<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/style.css">
     <title>Document</title>
</head>
<body>
     <div class="outerContainer">
          <h1 id="heading">Create New Password</h1>
          <p class="forgot-subtitle">Choose a strong password for your account.</p>

          <div class="innerContainer">
               <form id="resetPasswordForm">
                    <input type="hidden" id="resetRequestId">

                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="At least 6 characters">

                    <button type="submit" class="loginBtn">Save Changes</button>
               </form>
          </div>
     </div>
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     <script src="/reset.js"></script>
</body>
</html>
