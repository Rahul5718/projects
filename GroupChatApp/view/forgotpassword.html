<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Forgot Password</title>
     <link rel="stylesheet" href="/style.css">
</head>
<body>
     <div class="outerContainer">
          <h1 id="heading">Forgot Password</h1>
          <p class="forgot-subtitle">Enter your email and we’ll send you a reset link.</p>

          <div class="innerContainer">
               <form id="forgotPasswordForm">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your registered email" required>

                    <button type="submit" class="loginBtn">Send Reset Link</button>
               </form>

               <div id="messageBox" class="messageBox"></div>
               <a href="/login" class="auth-link">Back to Login</a>
          </div>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     <script src="/script.js"></script>
</body>
</html>
