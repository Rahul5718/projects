<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="outerContainer">
          <h1 id="heading">Login Bord</h1>
          <div class="innerContainer">
          <form onsubmit="handleLogin(event)">
               <label for="email">email/Phone</label>
               <input type="text" id="email" placeholder="email or phone">
               <br><br>

               <label for="password">password</label>
               <input type="password" id="password" placeholder="passwoed">
               <br><br>

               <button type="submit" class="loginBtn">Login</button>
          </form>
          <a id="forgotPasswordLink" href="/forgotpassword" class="auth-link">Forgot Password?</a>
          </div>
     </div>
</body>
<script src="/script.js"></script>
<script src="/socket.io/socket.io.js"></script>
</html>
