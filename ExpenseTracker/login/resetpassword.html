<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/style.css">
     <title>Document</title>
</head>
<body>
     <div class="outerDiv">
          <div class="headding"><h1>Create New Password</h1></div>
          <div class="innerDiv">
               <form id="resetPasswordForm">
                    <input type="hidden" id="resetRequestId">

                    <div class="form_panel">
                         <label for="newPassword">Enter New Password:</label><br>
                         <input type="password" id="newPassword" required placeholder="At least 6 characters">
                    </div><br>
                    <button type="submit">Save Changes & Login</button>
               </form>
          </div>
     </div>
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     <script src="/reset.js"></script>
</body>
</html>
