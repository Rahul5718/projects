<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     
     <title>Login</title>
     <link rel="stylesheet" href="/style.css">
</head>
<body>
     <div class="outerDiv">
          <div class="headding"><h1>Login page</h1></div>
          <div class="innerDiv">
               <form id="loginForm">
                     <div class="form_panel">

                         <!-- for email -->
                         
                              <label for="email">Enter Your email :</label>
                              <input type="email" id="email" required><br>
                         

                         <!-- for password -->
                              
                              <label for="password">Enter Your password :</label>
                              <input type="password" id="password" required><br>
                         
                  </div>
                    <!-- submit button -->
                    <button type="submit">Submit</button>
               </form>
               <a id="forgotPasswordLink" href="/user/forgotpassword" style="display:inline-block; margin-top: 15px; color: blue; text-decoration: underline; cursor: pointer;">Forgot Password?</a>
          </div>
     </div>
</body>
<script type="module" src="/expense.js"></script>
</html>
