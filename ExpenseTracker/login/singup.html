<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     
     <title>singup</title>
     <link rel="stylesheet" href="/style.css">
</head>
<body>

     <div class="heading">
          <h2>Register</h2>
     </div>
      
     <div class="container">
          <form id="regForm">
          <label for="name">Name:</label>
          <input type="text" id="name" placeholder="Name" required><br><br>
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Email" required><br><br>
          <label for="phn">Phone Number:</label>
          <input type="number" id="phn" placeholder="Phone Number" required><br><br>
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Password" required><br><br>
          <div class="button-container">
               <button type="submit"style="background-color: blue; color:white">Submit</button>
               <button type="button" id="loginButton" style="background-color: blue; color:white">Already have an account? Login</button>
          </div> 
     </form>
     </div>
</body>
<script type="module" src="/expense.js"></script>
</html>
