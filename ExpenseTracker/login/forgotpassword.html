<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/style.css">
     <title>Document</title>
</head>
<body>
     <div class="outerDiv">
          <div class="headding"><h1>Password Assistance</h1></div>
          <div class="innerDiv">
               <form id="forgotPasswordForm">
                    <div class="form_panel">
                         <label for="email">Enter your email address:</label><br>
                         <input type="email" id="email" required placeholder="name@domain.com">
                    </div>
                    <br>
                    <button type="submit">Continue</button>
               </form>
               <div id="messageBox" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
          </div>
     </div>
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/expense.js"></script>
    <script>
     document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
               e.preventDefault();
               const email = document.getElementById('email').value;
               const messageBox = document.getElementById('messageBox');
               
               try {
                    // Adjust this URL to match your server route mapping for sendResetEmail
                    const response = await axios.post('/password/forgotpassword', { email });
                    messageBox.innerHTML = `<p style="color: green;">${response.data.message}</p>`;
               } catch (err) {
                    messageBox.innerHTML = `<p style="color: red;">Error sending email. Please try again.</p>`;
               }
          });
    </script>
</body>
</html>
