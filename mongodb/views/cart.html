<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Shop</a></li>
                <li><a href="/cart" class="active">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Your Shopping Cart</h1>
        <div id="cart-container">
            <p>Loading cart items...</p>
        </div>
    </main>

     <form action="/create-order" method="POST" style="margin-top: 1.5rem; text-align: center;">
    <button class="btn" type="submit" style="background-color: #28a745; color: white; padding: 0.75rem 1.5rem; font-size: 1rem;">Order Now!</button>
</form>
  <script src="/cart.js"></script>
</body>
</html>
